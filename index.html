<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e39"><title>文化祭 | 提供順ボード</title><meta name="description" content="24席の着席順と提供完了をひと目で確認。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23173e39'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='24' fill='white'%3E1%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20260919-horizontal"><style id="middle-row-horizontal-fix">
/* D: 07 | 08, E: 09 | 10, F: 11 | 12. Keep each desk portrait. */
#layout > .row:nth-child(2) .table {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-flow: row;
  width: 100%;
  min-width: 0;
  max-width: 168px;
  margin-inline: auto;
}
#layout > .row:nth-child(2) .seat {
  min-width: 0;
  min-height: 82px;
  aspect-ratio: 0.72;
}
@media (max-width: 600px) {
  #layout > .row:nth-child(2) .table { max-width: 136px; }
  #layout > .row:nth-child(2) .seat { min-height: 72px; }
}
</style></head>
<body><main><header><div><p class="eyebrow">文化祭 / FLOOR GUIDE</p><h1>提供順ボード<span class="live">受付中</span></h1></div><div class="counter"><strong id="waiting">0</strong><span>席 待ち</span></div></header>
<section class="next" aria-live="polite"><span class="next-label">次の提供</span><strong id="next">まだお待ちの席はありません</strong><span id="free">空き 24席</span></section>
<div class="guide"><span><i class="dot"></i>空席をタップ → 順番を追加</span><span><i class="dot active"></i>番号を長押し → 提供完了</span></div>
<section class="floor" aria-label="24席の座席表"><div class="orientation"><span></span>教室の前側<span></span></div><div id="layout"></div><div class="entrance">入口側 ↑</div></section>
<footer><p>小さい数字は席番号・大きい数字は提供順です。</p><p id="storage-status" role="status">この端末に自動保存します。同じブラウザー・同じURLで復元できます。</p><div id="status" role="status">空いている席から受付できます</div></footer></main>
<dialog id="confirm"><form method="dialog"><div class="modal-icon">✓</div><p class="eyebrow" id="modal-seat"></p><h2>提供は完了しましたか？</h2><p>この席を空席に戻し、後の順番を<br>1つずつ繰り上げます。</p><button class="complete" id="complete" type="button">提供完了・空席に戻す</button><button class="cancel" value="cancel" autofocus>まだ・戻る</button></form></dialog>
<script src="app.js?v=20260919-storage1"></script></body></html>
